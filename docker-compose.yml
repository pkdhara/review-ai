services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reviewai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewai
      POSTGRES_USER: reviewai
      POSTGRES_PASSWORD: reviewai_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reviewai_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviewai_backend
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://reviewai:reviewai_pass@127.0.0.1:5432/reviewai
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /home/pradeep/ai-logs:/app/logs/reviews
      - /home/pradeep/fc:/home/pradeep/fc
      - /usr/share/antigravity:/usr/share/antigravity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reviewai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Antigravity Bridge ────────────────────────────────────────
  # OpenAI-compatible local LLM bridge → Local Antigravity Daemon Connect RPC
  # Connects directly to host's logged-in Google Account Antigravity session.
  antigravity-bridge:
    build:
      context: ./antigravity-bridge
      dockerfile: Dockerfile
    container_name: reviewai_bridge
    restart: unless-stopped
    network_mode: "host"
    pid: "host"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BRIDGE_PORT: 8899
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - bridge

  # ── PgAdmin (optional dev tool) ───────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reviewai_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reviewai.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  postgres_data:
